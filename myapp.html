<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AI Hand Tracking Heavy 3D Air Draw with Live Bones</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        body { margin: 0; overflow: hidden; background: #050505; font-family: sans-serif; }
        
        #webcam {
            position: absolute;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            transform: scaleX(-1);
            z-index: 1;
            opacity: 0.2; 
        }
        
        #canvas3d {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 2;
        }

        .status-panel {
            position: absolute;
            top: 20px; left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(0,0,0,0.85);
            color: #00ffcc;
            padding: 12px 25px;
            border-radius: 25px;
            font-size: 14px;
            text-align: center;
            pointer-events: none;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
            letter-spacing: 1px;
        }

        #clearBtn {
            position: absolute;
            bottom: 30px; left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            padding: 15px 40px;
            background: linear-gradient(45deg, #ff3366, #ff0044);
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 5px 20px rgba(255, 51, 102, 0.4);
            cursor: pointer;
            transition: 0.2s ease;
        }
        #clearBtn:active { transform: translateX(-50%) scale(0.95); }
    </style>
</head>
<body>

    <div class="status-panel" id="status">Initializing 3D Skeleton Engine...</div>
    <video id="webcam" autoplay playsinline></video>
    <div id="canvas3d"></div>
    <button id="clearBtn">WIPE ALL</button>

    <script>
        const videoElement = document.getElementById('webcam');
        const statusPanel = document.getElementById('status');
        const clearBtn = document.getElementById('clearBtn');
        
        let isHandDetected = false;
        let last3DPos = null;

        // --- 1. THREE.JS SETUP ---
        const container = document.getElementById('canvas3d');
        const scene = new THREE.Scene();
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 0); 

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        // Persistent drawings group
        const drawingGroup = new THREE.Group();
        scene.add(drawingGroup);

        // Live hand tracking bones group (yeh sirf tab dikhega jab haath samne ho)
        const skeletonGroup = new THREE.Group();
        scene.add(skeletonGroup);

        // Lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.8);
        dirLight.position.set(5, 10, 7);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 1024;
        dirLight.shadow.mapSize.height = 1024;
        scene.add(dirLight);

        const pointLight = new THREE.PointLight(0x00ffcc, 1.5, 10);
        pointLight.position.set(0, 2, -1);
        scene.add(pointLight);

        // --- 2. SKELETON CONNECTIONS MAP ---
        // MediaPipe ke 21 points ko aapas me jodne ka raasta (Bones Structure)
        const HAND_CONNECTIONS = [
            [0, 1], [1, 2], [2, 3], [3, 4],       // Thumb
            [0, 5], [5, 6], [6, 7], [7, 8],       // Index Finger
            [5, 9], [9, 10], [10, 11], [11, 12],  // Middle Finger
            [9, 13], [13, 14], [14, 15], [15, 16], // Ring Finger
            [0, 17], [17, 18], [18, 19], [19, 20], // Pinky
            [5, 17] // Palm base connection
        ];

        // --- 3. GYROSCOPE TRACKING ---
        let deviceOrientation = { alpha: 0, beta: 0, gamma: 0 };
        function onDeviceOrientation(event) {
            if (event.alpha !== null) {
                deviceOrientation.alpha = event.alpha;
                deviceOrientation.beta = event.beta;
                deviceOrientation.gamma = event.gamma;
                
                const alphaRad = THREE.MathUtils.degToRad(deviceOrientation.alpha);
                const betaRad = THREE.MathUtils.degToRad(deviceOrientation.beta);
                const gammaRad = THREE.MathUtils.degToRad(deviceOrientation.gamma);
                
                camera.rotation.set(betaRad, alphaRad, -gammaRad, 'YXZ');
            }
        }

        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
            window.addEventListener('click', () => {
                DeviceOrientationEvent.requestPermission()
                    .then(response => { if (response == 'granted') window.addEventListener('deviceorientation', onDeviceOrientation); })
                    .catch(console.error);
            }, { once: true });
        } else {
            window.addEventListener('deviceorientation', onDeviceOrientation);
        }

        // --- 4. MEDIAPIPE (AI HAND & BONES TRACKING) ---
        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.7,
            minTrackingConfidence: 0.7
        });

        hands.onResults((results) => {
            // Har frame par purani live bones ko clear karo taaki nayi position par ban sakein
            clearSkeleton();

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                isHandDetected = true;
                statusPanel.innerText = "⚡ TRACKING BONES & AIR DRAW ACTIVE";
                statusPanel.style.color = "#00ffcc";

                const landmarks = results.multiHandLandmarks[0];
                
                // --- Part A: Convert all 21 points into 3D Vector Space ---
                const points3D = landmarks.map(lm => {
                    const x = (1 - lm.x * 2) * 2.2; // Adjusted multipliers for mapping look
                    const y = (1 - lm.y * 2) * 2.2;
                    const z = -2.2; 
                    
                    const pos = new THREE.Vector3(x, y, z);
                    pos.applyQuaternion(camera.quaternion); // Screen rotation lock
                    return pos;
                });

                // --- Part B: Draw Live Skeleton Bones ---
                // Har connection line par ek heavy capsule/cylinder mesh banana
                HAND_CONNECTIONS.forEach(connection => {
                    const startPt = points3D[connection[0]];
                    const endPt = points3D[connection[1]];
                    createLiveBone(startPt, endPt);
                });

                // Knuckles par chote chote shiny spheres (points) banana
                points3D.forEach(pt => {
                    createLiveJoint(pt);
                });

                // --- Part C: Air Drawing Logic (Index Finger Tip = Point 8, Joint = Point 6) ---
                const tip = landmarks[8];
                const joint = landmarks[6];
                const currentDrawingPos = points3D[8]; // Uses index tip 3D pos

                if (tip.y < joint.y) { // If finger is straight up
                    if (last3DPos) {
                        if (last3DPos.distanceTo(currentDrawingPos) > 0.02) {
                            create3DTube(last3DPos, currentDrawingPos);
                            last3DPos = currentDrawingPos.clone();
                        }
                    } else {
                        last3DPos = currentDrawingPos.clone();
                    }
                } else {
                    last3DPos = null; 
                }
            } else {
                isHandDetected = false;
                last3DPos = null;
                statusPanel.innerText = "👋 Bring your Hand in front of Camera";
                statusPanel.style.color = "#ffcc00";
            }
        });

        const cameraUtils = new Camera(videoElement, {
            onFrame: async () => { await hands.send({ image: videoElement }); },
            width: 640, height: 480
        });
        cameraUtils.start();

        // --- 5. MESH CREATION FUNCTIONS (HEAVY METALLIC LOOK) ---

        // 1. Drawing Line Generator
        function create3DTube(pointStart, pointEnd) {
            const distance = pointStart.distanceTo(pointEnd);
            const geometry = new THREE.CylinderGeometry(0.04, 0.04, distance, 16); 
            const material = new THREE.MeshStandardMaterial({ 
                color: 0x00ffcc,        
                metalness: 0.9,          
                roughness: 0.15,
                castShadow: true
            });
            
            const mesh = new THREE.Mesh(geometry, material);
            mesh.castShadow = true;
            mesh.receiveShadow = true;

            const position = new THREE.Vector3().addVectors(pointStart, pointEnd).multiplyScalar(0.5);
            mesh.position.copy(position);
            mesh.lookAt(pointEnd);
            mesh.rotateX(Math.PI / 2);

            drawingGroup.add(mesh);
        }

        // 2. Live tracking bone (Cylinder)
        function createLiveBone(pointStart, pointEnd) {
            const distance = pointStart.distanceTo(pointEnd);
            const geometry = new THREE.CylinderGeometry(0.015, 0.015, distance, 12); // Slightly thinner than drawing
            const material = new THREE.MeshStandardMaterial({
                color: 0xffffff, // White chrome skeleton bones
                metalness: 0.9,
                roughness: 0.1,
                emissive: 0x333333 // Halka self illumination glow
            });

            const mesh = new THREE.Mesh(geometry, material);
            const position = new THREE.Vector3().addVectors(pointStart, pointEnd).multiplyScalar(0.5);
            mesh.position.copy(position);
            mesh.lookAt(pointEnd);
            mesh.rotateX(Math.PI / 2);

            skeletonGroup.add(mesh);
        }

        // 3. Live tracking Joint (Sphere)
        function createLiveJoint(position) {
            const geometry = new THREE.SphereGeometry(0.025, 12, 12);
            const material = new THREE.MeshStandardMaterial({
                color: 0xff3366, // Hot Pink joints knuckles par
                metalness: 0.8,
                roughness: 0.2
            });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.copy(position);
            skeletonGroup.add(mesh);
        }

        // Clear live skeleton frames to avoid ghosting
        function clearSkeleton() {
            while(skeletonGroup.children.length > 0) {
                const obj = skeletonGroup.children[0];
                obj.geometry.dispose();
                obj.material.dispose();
                skeletonGroup.remove(obj);
            }
        }

        // Wipe all Drawings button
        clearBtn.addEventListener('click', () => {
            while(drawingGroup.children.length > 0){ 
                const obj = drawingGroup.children[0];
                obj.geometry.dispose();  
                obj.material.dispose();
                drawingGroup.remove(obj); 
            }
        });

        // --- 6. RENDER LOOP ---
        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
